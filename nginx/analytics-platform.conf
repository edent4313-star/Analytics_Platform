# Nginx reverse proxy for Enterprise Analytics Platform
# Place in /etc/nginx/sites-available/ and symlink to sites-enabled/
# Adjust server_name to your internal hostname or IP

server {
    listen 80;
    server_name analytics.internal analytics-server 10.0.0.0;
    # Redirect HTTP to HTTPS (uncomment when SSL cert is available)
    # return 301 https://$host$request_uri;

    # React SPA — serve from built dist/
    location / {
        root /opt/analytics-platform/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Hashed assets — long cache (Vite adds content hashes)
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|ico)$ {
        root /opt/analytics-platform/frontend/dist;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # FastAPI backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        # Security: hide backend version
        proxy_hide_header X-Powered-By;
    }

    # Block direct access to sensitive paths
    location ~ /\. { deny all; }
    location = /favicon.ico { log_not_found off; access_log off; }

    # Logging
    access_log /var/log/nginx/analytics-platform-access.log;
    error_log  /var/log/nginx/analytics-platform-error.log;
}

